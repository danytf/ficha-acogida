:root{--bg:#FFFFFF;--surface:#F5F2ED;--soft:#F0ECE6;--ink:#151313;--muted:#5B5551;--line:#DDD7CF;--stripe:#DDD7CF;--red:#E51B1B;--red-text:#B30F14;--tint:#FDECEE;--ok:#1B7A4B;--focus:#151313;--r:8px;--f-display:"Barlow Condensed","Arial Narrow",sans-serif;--f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141212;--surface:#1E1B1B;--soft:#2A2626;--ink:#F2F0F0;--muted:#B8B1AB;--line:#3A3436;--stripe:#3A3436;--red-text:#FF7780;--tint:#2B1719;--ok:#2A9461;--focus:#F2F0F0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141212;--surface:#1E1B1B;--soft:#2A2626;--ink:#F2F0F0;--muted:#B8B1AB;--line:#3A3436;--stripe:#3A3436;--red-text:#FF7780;--tint:#2B1719;--ok:#2A9461;--focus:#F2F0F0;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:96px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1:focus,.q-title:focus{outline:none}
img{max-width:100%;display:block}
#app{overflow-wrap:anywhere}
button,summary{font:inherit}

/* Cabecera */
header.top{position:sticky;top:env(safe-area-inset-top);z-index:10;background:var(--bg);height:72px;overflow:hidden;border-bottom:1px solid var(--line)}
header.top .brand{position:absolute;left:max(16px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);background:#fff;border-radius:8px;padding:6px 12px;z-index:2}
header.top .brand img{width:150px;height:auto}
header.top .slash{position:absolute;top:0;bottom:0;right:-24px;width:34%;min-width:120px;background:var(--red);transform:skewX(-14deg);z-index:1}
header.top .slash::before{content:"";position:absolute;top:0;bottom:0;left:-14px;width:14px;background:var(--stripe)}
header.top .tag{position:absolute;right:max(16px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);z-index:3;color:#fff;font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:20px;line-height:1;white-space:nowrap}
.bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .25s ease}
@media (max-width:559px){header.top .tag{display:none}header.top .slash{width:90px;min-width:90px}}
@media (min-width:760px){header.top .brand img{width:180px}}

/* Maquetación */
.wrap{max-width:1040px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left)) 40px max(16px,env(safe-area-inset-right))}
.narrow{max-width:720px;margin:0 auto}
.eyebrow{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--red-text);font-size:19px;margin:0 0 6px}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;margin:0;line-height:.98;text-wrap:balance}
h1{font-weight:800;font-size:clamp(38px,9vw,64px);letter-spacing:.005em;overflow-wrap:anywhere}
h2{font-weight:800;font-size:clamp(28px,6vw,36px);margin-bottom:12px}
h3{font-weight:800;font-size:clamp(24px,5vw,28px);margin-bottom:8px}
p{margin:0 0 14px}
.lead{font-size:20px;max-width:60ch}
.muted{color:var(--muted)}
.small{font-size:17px}

/* Campos y opciones */
fieldset{border:0;margin:0 0 28px;padding:0;min-width:0}
legend{padding:0;margin:0 0 12px;font-weight:700;font-size:20px;line-height:1.3}
.field{margin-bottom:24px}
.field label.lbl{display:block;font-weight:700;margin-bottom:6px;font-size:20px}
.field input[type=text]{width:100%;min-height:52px;padding:10px 14px;border:2px dotted var(--red);border-radius:var(--r);background:var(--bg);color:var(--ink);font:inherit}
.field input[type=text]:focus{border-style:solid}
.opts{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;min-height:52px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;min-width:0}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt .dot{flex:0 0 24px;height:24px;border:2px solid var(--muted);border-radius:50%;margin-top:1px;display:grid;place-items:center;background:var(--bg)}
.opt .dot::after{content:"";width:12px;height:12px;border-radius:50%;background:transparent}
.opt .txt{min-width:0;overflow-wrap:anywhere}
.opt:hover{border-color:var(--red)}
.opt:has(input:checked){border-color:var(--red);background:var(--tint)}
.opt:has(input:checked) .dot{border-color:var(--red)}
.opt:has(input:checked) .dot::after{background:var(--red)}
.opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.scale .opt{justify-content:center;align-items:center;padding:10px 0;font-family:var(--f-display);font-weight:800;font-size:28px;text-align:center;min-height:56px}
.scale .opt .dot{display:none}
.scale-ends{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:17px;margin-top:6px}
.err{color:var(--red-text);font-weight:600;margin:0 0 14px;min-height:1.5em}


/* Mejor / peor */
.bws{display:grid;gap:10px}
.bw{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
.bw .txt{min-width:0;flex:1}
.bw:has(input:checked){border-color:var(--ink)}
.chips{display:flex;gap:6px;flex:none}
.chip{position:relative;display:block;cursor:pointer}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:flex;align-items:center;justify-content:center;min-width:64px;min-height:48px;padding:0 10px;border:2px solid var(--line);border-radius:var(--r);background:var(--bg);font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:19px;line-height:1}
.chip-m:has(input:checked) span{background:var(--red);border-color:var(--red);color:#fff}
.chip-l:has(input:checked) span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip:hover span{border-color:var(--red)}
.chip:has(input:focus-visible) span{outline:3px solid var(--focus);outline-offset:2px}
@media (max-width:480px){.bw{flex-direction:column;align-items:stretch}.chips{justify-content:flex-end}.chip span{min-width:88px}}

.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* Botones */
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:8px}
.btn{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:22px;line-height:1;padding:14px 22px;min-height:52px;border-radius:var(--r);border:2px solid transparent;cursor:pointer}
.btn-primary{background:var(--red);color:#fff;border-color:var(--red)}
.btn-ink{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:hover{border-color:var(--red)}
.btn-primary:hover{border-color:var(--ink)}
.back{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:12px 4px;min-height:44px}
.back:hover{color:var(--ink)}
.qcount{font-family:var(--f-display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-size:18px;margin-bottom:10px}
.q-title{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(30px,7vw,44px);line-height:1;margin:0 0 20px;text-wrap:balance}
.q-hint{display:block;font-family:var(--f-body);text-transform:none;font-size:17px;letter-spacing:0;color:var(--muted);font-weight:400;margin-top:8px;line-height:1.4}
.status{min-height:1.6em;margin-top:10px;font-weight:600;color:var(--ok)}

/* Ficha */
.facts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));margin:20px 0}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.fact .k{display:block;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-size:17px}
.fact .v{display:block;font-weight:600;overflow-wrap:anywhere}
.action{background:var(--red);color:#fff;border-radius:var(--r);padding:18px 20px;margin:20px 0}
.action .k{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:19px;display:block;margin-bottom:4px}
.action p{margin:0;font-size:20px;font-weight:600}
.sec{margin:28px 0 0}
.sec h2{border-bottom:2px solid var(--line);padding-bottom:6px}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card .role{display:inline-block;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:17px;border:2px solid var(--line);border-radius:999px;padding:2px 12px;margin-bottom:8px;background:var(--bg)}
.card h4{margin:12px 0 4px;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:18px;color:var(--red-text)}
ul.tight{margin:0;padding-left:1.2em}
ul.tight li{margin:0 0 6px}
ul.sig{margin:0;padding:0;list-style:none}
ul.sig li{margin:0 0 10px;padding-left:12px;border-left:2px solid var(--line)}
ul.sig b{font-weight:700}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;color:var(--muted);font-size:17px;margin-top:20px}
.hyp{background:var(--tint);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin:0 0 14px;font-size:17px}

/* Secciones plegables */
details.fold{margin-top:14px}
details.fold>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:10px 16px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;list-style:none;font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:24px;line-height:1.05}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-size:30px;line-height:1;color:var(--red-text)}
details.fold[open]>summary{border-color:var(--red)}
details.fold[open]>summary::after{content:"\2013"}
details.fold>summary:hover{border-color:var(--red)}
details.fold .inner{padding:16px 2px 4px}

/* Cierre y valores */
.closing{margin-top:32px;background:var(--surface);border:2px solid var(--red);border-radius:var(--r);padding:16px 18px;font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(24px,5.5vw,30px);line-height:1.05;text-wrap:balance}
footer.vals{margin-top:40px;background:var(--red);color:#fff;padding:14px 12px;text-align:center;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:14px;line-height:1.7}
footer.vals span{white-space:nowrap;display:inline-block;margin:0 .25em}

/* Impresión / PDF */
@page{size:A4;margin:12mm}
@media print{
  :root:root:root{--bg:#FFFFFF;--surface:#F5F2ED;--soft:#F0ECE6;--ink:#151313;--muted:#5B5551;--line:#DDD7CF;--stripe:#DDD7CF;--red-text:#B30F14;--tint:#FDECEE;--ok:#1B7A4B;color-scheme:light}
  html,body{background:#fff}
  body{font-size:13px;line-height:1.32;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header.top{position:relative;top:0;height:64px;border-bottom:0;margin:0;width:100%}
  header.top .brand img{width:130px}
  .bar,.row,.status,.back,#barwrap{display:none!important}
  .wrap{padding:8px 0 0;max-width:none}
  h1{font-size:34px}h2{font-size:22px;margin-bottom:8px}h3{font-size:20px;margin-bottom:6px}
  .sec{margin-top:12px}.facts{margin:10px 0}.action{margin:12px 0;padding:12px 16px}.action p{font-size:16px}
  .cards{gap:10px}.card{padding:10px 14px}.fact,.action,.sig li{break-inside:avoid}
  .note,.hyp,.small,.fact .k,.scale-ends{font-size:12.5px}
  details.fold{margin-top:10px}
  details.fold>summary{min-height:0;padding:6px 12px;font-size:19px}
  details.fold>summary::after,details.fold[open]>summary::after{content:none}
  details.fold .inner{padding:10px 2px 0}
  .closing{margin-top:12px;font-size:22px;padding:8px 14px;break-inside:avoid}
  footer.vals{margin-top:12px;font-size:11px;padding:6px 8px;break-inside:avoid}
}
[hidden]{display:none!important}
@media (min-width:760px){footer.vals{font-size:18px;letter-spacing:.06em}}
@media (min-width:1100px){.wrap{max-width:1200px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

/* ===== Lógica ===== */
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* Cada situación suma +1 al estilo marcado como "más como yo" y −1 al marcado como "menos" (de −12 a +12).
   claro: 6 o más y 4 de ventaja; par: dos estilos a 1 punto o menos y ambos con 4 o más;
   sin preferencia: el primero no llega a 4 o hay tres estilos a 1 punto de distancia; ligera: el resto. */
function scoresOf(s){
  var sc = {A:0,R:0,T:0,P:0};
  s.m.forEach(function(k){ if(k) sc[k]++; });
  s.l.forEach(function(k){ if(k) sc[k]--; });
  return sc;
}
function lkMeans(s){
  var t = {A:0,R:0,T:0,P:0}, n = {A:0,R:0,T:0,P:0};
  LK.forEach(function(it,i){ if (s.lk && s.lk[i]) { t[it.k] += s.lk[i]; n[it.k]++; } });
  var m = {}; ['A','R','T','P'].forEach(function(k){ m[k] = n[k] ? t[k]/n[k] : 0; });
  return m;
}
function profile(sc){
  var keys = ['A','R','T','P'].sort(function(a,b){ return sc[b]-sc[a]; });
  var s1 = sc[keys[0]], s2 = sc[keys[1]], s3 = sc[keys[2]];
  if (s1 <= 3 || s1 - s3 <= 1) return {tipo:'sin', max:s1, items:[], scores:sc};
  if (s1 - s2 <= 1 && s2 >= 4) return {tipo:'par', max:s1, items:[keys[0],keys[1]], scores:sc};
  return {tipo: (s1 >= 6 && s1 - s2 >= 4) ? 'claro' : 'ligera', max:s1, items:[keys[0]], scores:sc};
}
/* Fiabilidad de este resultado: ¿se contradicen las respuestas? ¿lo confirman las afirmaciones de 1 a 5? */
function confianza(s, pf){
  var most = {A:0,R:0,T:0,P:0}, least = {A:0,R:0,T:0,P:0};
  s.m.forEach(function(k){ if(k) most[k]++; }); s.l.forEach(function(k){ if(k) least[k]++; });
  var contradice = ['A','R','T','P'].some(function(k){ return most[k] >= 4 && least[k] >= 3; });
  var lm = lkMeans(s);
  var igual = s.lk.every(function(v){ return v === s.lk[0]; });
  if (pf.tipo === 'sin') return {nivel: contradice ? 'baja' : null, contradice: contradice, igual: igual, lm: lm};
  var avg = pf.items.reduce(function(a,k){ return a + lm[k]; }, 0) / pf.items.length;
  var nivel = 'media';
  if (contradice || avg <= 2.5) nivel = 'baja';
  else if (avg >= 3.5 && !igual && (pf.tipo === 'claro' || pf.tipo === 'par')) nivel = 'alta';
  return {nivel: nivel, contradice: contradice, igual: igual, avg: avg, lm: lm};
}
function guiaNivel(exp, comp){
  if (exp==='none' || comp==='low') return 'alta';
  if (exp==='lots' && comp==='high') return 'baja';
  return 'media';
}
function sg(n){ return (n>0?'+':n<0?'\u2212':'') + Math.abs(n); }
function prefLabel(pf){
  if (pf.tipo==='sin') return 'Sin preferencia clara';
  var n = ST[pf.items[0]].name, sc = pf.scores;
  if (pf.tipo==='claro') return n + ' (claro, ' + sg(sc[pf.items[0]]) + ' de 12)';
  if (pf.tipo==='ligera') return n + ' (inclinación ligera, ' + sg(sc[pf.items[0]]) + ' de 12)';
  return n + ' y ' + ST[pf.items[1]].name + ' a la par (' + sg(sc[pf.items[0]]) + ' y ' + sg(sc[pf.items[1]]) + ' de 12)';
}

function buildFicha(s){
  var counts = scoresOf(s);
  var pf = profile(counts);
  /* Dos estilos a la par: va primero el que marcó en la situación 1 (qué le gustaría que pasara primero) */
  if (pf.tipo==='par' && counts[pf.items[0]]===counts[pf.items[1]] && pf.items[1]===s.m[0]) pf.items.reverse();
  var conf = confianza(s, pf);
  var nivel = guiaNivel(s.exp, s.comp);
  var empieza = pf.tipo==='sin'
    ? 'Que te vea hacerlo 20–30 minutos y que practique enseguida una sola técnica. Observa qué te pide y decide por lo que veas.'
    : pf.tipo==='par'
      ? 'Empieza por el estilo ' + ST[pf.items[0]].name + '. ' + ST[pf.items[0]].primeras + ' Después prueba con el estilo ' + ST[pf.items[1]].name + '. ' + ST[pf.items[1]].primeras
      : ST[pf.items[0]].primeras;
  var ajustes = [GUIA[nivel]];
  if (s.conf <= 2) ajustes.push('Seguridad baja: empieza con metas pequeñas y alcanzables, y cuéntale qué se espera en estas primeras horas.');
  else if (s.conf >= 4) ajustes.push('Seguridad alta: comprueba que domina lo básico antes de soltarle (mira las comprobaciones de abajo).');
  ajustes.push(WORRY[s.worry].texto);
  var senales = pf.items.map(function(k){ return ST[k].senales[0]; });
  var senal = senales[0] || null;
  var nota = null;
  if (pf.tipo==='ligera') nota = 'Inclinación ligera: tómalo como hipótesis y comprueba qué consejos de esta tarjeta le funcionan.';
  else if (pf.tipo==='par') nota = 'Dos estilos a la par: va primero el que marcó al elegir qué le gustaría que pasara primero. Combina los consejos de ambas tarjetas y comprueba cuáles le funcionan.';
  else if (pf.tipo==='sin') nota = 'Sus respuestas no se inclinan hacia un estilo: usa la base común, observa cómo reacciona y ajusta según lo que veas.';
  if (conf.nivel === 'baja') nota = (nota ? nota + ' ' : '') + 'Resultado poco fiable: ' + (conf.contradice ? 'hay respuestas que se contradicen' : 'las afirmaciones de 1 a 5 no lo confirman') + '. Usa la base común y fíate más de lo que veas.';
  if (conf.igual) nota = (nota ? nota + ' ' : '') + 'Contestó igual a todas las afirmaciones de 1 a 5, así que no sirven para confirmar el resultado.';
  if (pf.tipo === 'sin' && conf.nivel !== 'baja' && !conf.igual) {
    var kk = ['A','R','T','P'].sort(function(a,b){ return conf.lm[b]-conf.lm[a]; });
    if (conf.lm[kk[0]] >= 4 && conf.lm[kk[0]] - conf.lm[kk[1]] >= 1) nota = (nota ? nota + ' ' : '') + 'Las afirmaciones de 1 a 5 apuntan algo hacia el estilo ' + ST[kk[0]].name + ': compruébalo.';
  }
  var facts = [
    ['Experiencia previa', EXP[s.exp].short],
    ['Formación inicial', COMP[s.comp]],
    ['Seguridad para empezar', s.conf + ' de 5'],
    ['Le preocupa', WORRY[s.worry].short],
    ['Preferencia orientativa', prefLabel(pf)]
  ];
  if (conf.nivel) facts.push(['Fiabilidad de este resultado', conf.nivel==='alta' ? 'Alta: las respuestas son coherentes entre sí' : conf.nivel==='media' ? 'Media: tómalo como punto de partida' : 'Baja: respuestas contradictorias o poco consistentes']);
  return {nombre:s.nombre, re:s.re, fecha:s.fecha, facts:facts, empieza:empieza, ajustes:ajustes, senal:senal, senales:senales, nota:nota,
          estilos:pf.items.map(function(k){ return ST[k]; }), pf:pf, counts:counts};
}

function toText(f){
  var L = [];
  L.push('FICHA DE ACOGIDA · ' + f.nombre.toUpperCase());
  L.push(f.fecha + (f.re ? ' · RE: ' + f.re : ''));
  L.push('');
  f.facts.forEach(function(x){ L.push(x[0] + ': ' + x[1]); });
  L.push('');
  L.push('EMPIEZA POR ESTO');
  L.push(f.empieza);
  L.push('');
  L.push('TRES COSAS PARA HOY');
  f.ajustes.forEach(function(a){ L.push('- ' + a); });
  if (f.senales.length){ L.push(''); L.push(f.senales.length>1 ? 'SEÑALES A VIGILAR' : 'UNA SEÑAL A VIGILAR'); f.senales.forEach(function(x){ L.push(x[0] + ' → ' + x[1]); }); }
  L.push('');
  L.push('BASE COMÚN');
  COMUN.forEach(function(a){ L.push('- ' + a); });
  L.push('');
  if (f.nota){ L.push(f.nota); L.push(''); }
  f.estilos.forEach(function(e){
    L.push('CÓMO ENSEÑARLE · ' + e.name.toUpperCase());
    L.push(e.aprende);
    L.push('Cómo explicarle:');
    e.explicar.forEach(function(a){ L.push('- ' + a); });
    L.push('Feedback: ' + e.feedback);
    L.push('Señales y qué hacer:');
    e.senales.forEach(function(a){ L.push('- ' + a[0] + ' → ' + a[1]); });
    if (e.nota) L.push(e.nota);
    L.push('');
  });
  L.push('COMPRUEBA HOY');
  COMPRUEBA.forEach(function(a){ L.push('- ' + a); });
  L.push('');
  L.push(AVISO);
  return L.join('\n');
}

/* ===== Enlace con las respuestas (van en el fragmento de la URL, no se envían a ningún servidor) ===== */
function b64enc(str){
  var bytes = new TextEncoder().encode(str), bin = '';
  for (var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64dec(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '=';
  var bin = atob(s), bytes = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function isoToday(){ var d = new Date(); function z(n){ return (n<10?'0':'')+n; } return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function fmtDate(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}); }
function encodeState(s){
  return 'v3.' + b64enc(JSON.stringify({n:s.nombre, r:s.re, e:s.exp, c:s.comp, f:s.conf, w:s.worry, m:s.m.join(''), l:s.l.join(''), k:s.lk.join(''), d:isoToday()}));
}
function decodeState(hash){
  try{
    var h = String(hash||'').replace(/^#/,'');
    if (h.indexOf('v3.') !== 0) return null;
    var o = JSON.parse(b64dec(h.slice(3)));
    if (!o || typeof o !== 'object') return null;
    var nombre = String(o.n||'').trim().slice(0,60), re = String(o.r||'').trim().slice(0,60);
    var m = String(o.m||''), l = String(o.l||''), k = String(o.k||'');
    if (!nombre || !EXP[o.e] || !COMP[o.c] || !WORRY[o.w]) return null;
    if (!(o.f===1||o.f===2||o.f===3||o.f===4||o.f===5)) return null;
    if (!/^[ARTP]{12}$/.test(m) || !/^[ARTP]{12}$/.test(l) || !/^[1-5]{8}$/.test(k)) return null;
    for (var q=0;q<12;q++) if (m.charAt(q)===l.charAt(q)) return null;
    var d = /^\d{4}-\d{2}-\d{2}$/.test(String(o.d)) ? String(o.d) : isoToday();
    return {nombre:nombre, re:re, exp:o.e, comp:o.c, conf:o.f, worry:o.w, m:m.split(''), l:l.split(''), lk:k.split('').map(Number), fecha:fmtDate(d)};
  }catch(e){ return null; }
}
function baseUrl(){ return location.href.split('#')[0]; }
function canLink(){ return location.protocol === 'https:' || location.protocol === 'http:'; }

/* ===== Interfaz ===== */
var app = document.getElementById('app');
var bar = document.getElementById('bar');
var barwrap = document.getElementById('barwrap');
var tagEl = document.getElementById('tag');
var TOTAL = 17;
function newState(){ return {nombre:'', re:'', fecha:'', exp:null, comp:null, conf:null, worry:null, m:[null,null,null,null,null,null,null,null,null,null,null,null], l:[null,null,null,null,null,null,null,null,null,null,null,null], lk:[null,null,null,null,null,null,null,null], order:[], lkOrder:[]}; }
var S = newState();

function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function setProgress(step){ var p = Math.round(step/(TOTAL-1)*100); bar.style.width = p + '%'; barwrap.setAttribute('aria-valuenow', p); }
function focusTop(){ window.scrollTo(0,0); var h = app.querySelector('h1,.q-title'); if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); } }
function listHtml(a){ return '<ul class="tight">'+a.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>'; }
function sigHtml(a){ return '<ul class="sig">'+a.map(function(x){ return '<li><b>'+esc(x[0])+'</b> '+esc(x[1])+'</li>'; }).join('')+'</ul>'; }
var VALS = '<footer class="vals" aria-hidden="true"><span>COMPROMISO ·</span><span>COMPAÑERISMO ·</span><span>AMBICIÓN POR EL PROGRESO ·</span><span>INICIATIVA Y AUTONOMÍA ·</span><span>AFÁN DE SUPERACIÓN ·</span><span>ORGULLO</span></footer>';
function copyText(txt, st, okMsg){
  function ok(){ st.textContent = okMsg; }
  function bad(){ st.textContent = 'No se ha podido copiar. Selecciona el texto y cópialo a mano.'; }
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy') ? ok() : bad(); }catch(e){ bad(); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok, fallback); } else fallback();
}
function opt(name, value, text, checked){
  return '<label class="opt"><input type="radio" name="'+name+'" value="'+value+'"'+(checked?' checked':'')+'><span class="dot" aria-hidden="true"></span><span class="txt">'+esc(text)+'</span></label>';
}

function viewIntro(){
  tagEl.textContent = 'Primer día';
  setProgress(0);
  app.innerHTML =
   '<div class="narrow">'+
   '<p class="eyebrow">Ficha de acogida</p>'+
   '<h1>Cuéntanos cómo aprendes</h1>'+
   '<p class="lead" style="margin-top:16px">Son unos 8 minutos. Con tus respuestas, tu RE sabrá cómo ayudarte desde la primera hora. No hay respuestas buenas ni malas, y no es una evaluación.</p>'+
   '<p class="muted small">Tus respuestas no se guardan en ningún sitio. Solo se envían a tu RE si tú pulsas el botón al final.</p>'+
   '<div class="field" style="margin-top:24px"><label class="lbl" for="nombre">Tu nombre</label><input type="text" id="nombre" autocomplete="given-name" maxlength="60" value="'+esc(S.nombre)+'"></div>'+
   '<div class="field"><label class="lbl" for="re">Nombre de tu RE <span class="muted" style="font-weight:400">(opcional)</span></label><input type="text" id="re" maxlength="60" value="'+esc(S.re)+'"></div>'+
   '<p class="err" id="err" role="alert"></p>'+
   '<div class="row"><button class="btn btn-primary" id="go" type="button">Empezar</button></div>'+
   '</div>'+VALS;
  document.getElementById('go').onclick = function(){
    var n = document.getElementById('nombre').value.trim();
    if(!n){ document.getElementById('err').textContent = 'Escribe tu nombre para continuar.'; document.getElementById('nombre').focus(); return; }
    S.nombre = n; S.re = document.getElementById('re').value.trim();
    viewA();
  };
  document.getElementById('nombre').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('go').click(); });
}

function viewA(){
  setProgress(1);
  app.innerHTML =
   '<div class="narrow">'+
   '<p class="qcount">Paso 1 de '+(QB.length+3)+' · Tu punto de partida</p>'+
   '<h1 class="q-title" style="font-size:clamp(34px,8vw,52px)">Para empezar</h1>'+
   '<fieldset><legend>¿Has captado o vendido antes cara a cara?</legend><div class="opts">'+
     opt('exp','none','No, es la primera vez',S.exp==='none')+opt('exp','some','Algo (menos de 6 meses)',S.exp==='some')+opt('exp','lots','Sí, más de 6 meses',S.exp==='lots')+
   '</div></fieldset>'+
   '<fieldset><legend>De la formación inicial, ¿cuánto sientes que has entendido?</legend><div class="opts">'+
     opt('comp','low','Poco, tengo muchas dudas',S.comp==='low')+opt('comp','mid','Lo principal, con algunas dudas',S.comp==='mid')+opt('comp','high','Casi todo',S.comp==='high')+
   '</div></fieldset>'+
   '<fieldset><legend>¿Qué nivel de seguridad tienes para empezar hoy a parar gente?</legend>'+
     '<div class="scale">'+[1,2,3,4,5].map(function(n){ return '<label class="opt"><input type="radio" name="conf" value="'+n+'"'+(S.conf===n?' checked':'')+' aria-label="'+n+' de 5"><span class="dot" aria-hidden="true"></span><span class="txt">'+n+'</span></label>'; }).join('')+'</div>'+
     '<div class="scale-ends"><span>1 · Muy poca</span><span>5 · Mucha</span></div>'+
   '</fieldset>'+
   '<fieldset><legend>¿Qué es lo que más te preocupa hoy?</legend><div class="opts">'+
     opt('worry','parar','Cómo parar a la gente',S.worry==='parar')+
     opt('worry','objeciones','Qué responder a las objeciones',S.worry==='objeciones')+
     opt('worry','cuota','Cómo cerrar y negociar la cuota',S.worry==='cuota')+
     opt('worry','quedarmal','Hacerlo mal delante de mi RE',S.worry==='quedarmal')+
     opt('worry','proyecto','No entender bien el proyecto o la ONG',S.worry==='proyecto')+
     opt('worry','ninguna','Ninguna cosa en concreto',S.worry==='ninguna')+
   '</div></fieldset>'+
   '<p class="err" id="err" role="alert"></p>'+
   '<div class="row"><button class="btn btn-primary" id="next" type="button">Siguiente</button><button class="back" id="back" type="button">Atrás</button></div>'+
   '</div>';
  ['exp','comp','worry'].forEach(function(n){
    Array.prototype.forEach.call(app.querySelectorAll('input[name="'+n+'"]'), function(i){ i.onchange = function(){ S[n] = i.value; }; });
  });
  Array.prototype.forEach.call(app.querySelectorAll('input[name="conf"]'), function(i){ i.onchange = function(){ S.conf = parseInt(i.value,10); }; });
  document.getElementById('back').onclick = viewIntro;
  document.getElementById('next').onclick = function(){
    if(!S.exp || !S.comp || !S.conf || !S.worry){ document.getElementById('err').textContent = 'Responde a las cuatro preguntas para continuar.'; return; }
    if(!S.order.length){ S.order = QB.map(function(){ return shuffle(['A','R','T','P']); }); }
    if(!S.lkOrder.length){ S.lkOrder = shuffle([0,1,2,3,4,5,6,7]); }
    viewB(0);
  };
  focusTop();
}

function viewB(i){
  setProgress(2+i);
  var q = QB[i], ord = S.order[i], N = QB.length;
  function chip(g, k, txt, lab){ return '<label class="chip chip-'+g+'"><input type="radio" name="'+g+'" value="'+k+'"'+(S[g][i]===k?' checked':'')+' aria-label="'+lab+': '+esc(txt)+'"><span>'+(g==='m'?'Más':'Menos')+'</span></label>'; }
  app.innerHTML =
   '<div class="narrow">'+
   '<p class="qcount">Paso '+(i+2)+' de '+(N+3)+' · Cómo aprendes · '+(i+1)+'/'+N+'</p>'+
   '<h1 class="sr-only">Situación '+(i+1)+' de '+N+'</h1>'+
   '<fieldset><legend class="q-title">'+esc(q.t)+'<span class="q-hint">Marca una como la que más se parece a ti y otra como la que menos.</span></legend><div class="bws">'+
     ord.map(function(k){ var t = q.o[k];
       return '<div class="bw"><span class="txt">'+esc(t)+'</span><span class="chips">'+chip('m',k,t,'Más se parece a mí')+chip('l',k,t,'Menos se parece a mí')+'</span></div>'; }).join('')+
   '</div></fieldset>'+
   '<p class="err" id="err" role="alert"></p>'+
   '<div class="row"><button class="btn btn-primary" id="next" type="button">'+'Siguiente'+'</button><button class="back" id="back" type="button">Atrás</button></div>'+
   '</div>';
  function other(g){ return g==='m' ? 'l' : 'm'; }
  ['m','l'].forEach(function(g){
    Array.prototype.forEach.call(app.querySelectorAll('input[name="'+g+'"]'), function(inp){
      inp.onchange = function(){
        S[g][i] = inp.value;
        var o = other(g);
        if (S[o][i] === inp.value){
          S[o][i] = null;
          Array.prototype.forEach.call(app.querySelectorAll('input[name="'+o+'"]'), function(x){ x.checked = false; });
        }
        document.getElementById('err').textContent = '';
      };
    });
  });
  document.getElementById('back').onclick = function(){ if(i===0) viewA(); else viewB(i-1); };
  document.getElementById('next').onclick = function(){
    if(!S.m[i] || !S.l[i]){ document.getElementById('err').textContent = !S.m[i] ? 'Marca cuál se parece más a ti.' : 'Marca cuál se parece menos a ti.'; return; }
    if(i<N-1) viewB(i+1); else viewL(0);
  };
  focusTop();
}

function viewL(j){
  setProgress(2+QB.length+j);
  var N = QB.length, idx = S.lkOrder.slice(j*4, j*4+4);
  app.innerHTML =
   '<div class="narrow">'+
   '<h1 class="sr-only">Afirmaciones '+(j+1)+' de 2</h1>'+
   '<p class="qcount">Paso '+(N+2+j)+' de '+(N+3)+' · Cuánto te identificas · '+(j+1)+'/2</p>'+
   '<p class="lead" style="margin-bottom:20px">¿Cuánto estás de acuerdo con cada frase?</p>'+
   idx.map(function(ix){
     return '<fieldset><legend>'+esc(LK[ix].t)+'</legend><div class="scale">'+[1,2,3,4,5].map(function(n){ return '<label class="opt"><input type="radio" name="lk'+ix+'" value="'+n+'"'+(S.lk[ix]===n?' checked':'')+' aria-label="'+n+' de 5"><span class="dot" aria-hidden="true"></span><span class="txt">'+n+'</span></label>'; }).join('')+'</div><div class="scale-ends"><span>1 · Nada de acuerdo</span><span>5 · Muy de acuerdo</span></div></fieldset>';
   }).join('')+
   '<p class="err" id="err" role="alert"></p>'+
   '<div class="row"><button class="btn btn-primary" id="next" type="button">'+(j===1?'Terminar':'Siguiente')+'</button><button class="back" id="back" type="button">Atrás</button></div>'+
   '</div>';
  idx.forEach(function(ix){
    Array.prototype.forEach.call(app.querySelectorAll('input[name="lk'+ix+'"]'), function(inp){
      inp.onchange = function(){ S.lk[ix] = parseInt(inp.value,10); document.getElementById('err').textContent = ''; };
    });
  });
  document.getElementById('back').onclick = function(){ if(j===0) viewB(N-1); else viewL(0); };
  document.getElementById('next').onclick = function(){
    if(idx.some(function(ix){ return !S.lk[ix]; })){ document.getElementById('err').textContent = 'Responde a las cuatro frases para continuar.'; return; }
    if(j===0) viewL(1); else viewDone();
  };
  focusTop();
}

/* Pantalla del captador: corta, positiva y con el botón para enviar a su RE */
function viewDone(){
  setProgress(TOTAL-1);
  S.fecha = fmtDate(isoToday());
  var f = buildFicha(S), pf = f.pf;
  var cuerpo;
  if (pf.tipo==='sin'){
    cuerpo = '<div class="card"><h3>Tus respuestas están repartidas</h3><p>No se inclinan por una sola manera de aprender. Es normal y no es malo: tu RE lo irá comprobando contigo sobre la marcha.</p></div>';
  } else {
    var intro = pf.tipo==='ligera' ? '<p class="muted small">Tus respuestas se inclinan ligeramente hacia este estilo, pero no del todo.</p>'
              : pf.tipo==='par' ? '<p class="muted small">Tus respuestas se reparten a partes iguales entre estos dos estilos.</p>' : '';
    cuerpo = intro + '<div class="cards">' + pf.items.map(function(k){ var e = ST[k];
      return '<div class="card"><h3>'+esc(e.name)+'</h3><p>'+esc(e.tuAprendes)+'</p><h4>Qué puedes pedirle a tu RE</h4>'+listHtml(e.tuPides)+'</div>'; }).join('') + '</div>';
  }
  var link = canLink() ? baseUrl() + '#' + encodeState(S) : null;
  var share = link
    ? '<div class="row" style="margin-top:20px"><button class="btn btn-primary" id="wa" type="button">Enviar a mi RE por WhatsApp</button><button class="btn btn-ghost" id="copy" type="button">Copiar enlace</button></div>'
    : '<div class="row" style="margin-top:20px"><button class="btn btn-primary" id="copy" type="button">Copiar resumen para mi RE</button></div><p class="muted small" style="margin-top:10px">Para enviar un enlace, la app tiene que estar publicada en una dirección web.</p>';
  app.innerHTML =
   '<div class="narrow">'+
   '<p class="eyebrow">Hecho</p>'+
   '<h1>Gracias, '+esc(S.nombre)+'</h1>'+
   '<p class="lead" style="margin-top:16px">Tu RE recibirá un resumen para ayudarte a aprender mejor. No es una nota ni una evaluación.</p>'+
   '<section class="sec"><h2>Cómo aprendes</h2>'+cuerpo+'</section>'+
   '<section class="sec"><h2>Envíaselo a tu RE</h2><p>Solo se envía si tú pulsas el botón. Lo ve quien reciba el enlace.</p>'+share+'<p class="status" id="status" role="status"></p></section>'+
   '<div class="row"><button class="back" id="back" type="button">Atrás</button><button class="back" id="again" type="button">Empezar de nuevo</button></div>'+
   '<div class="closing">Tu RE te acompaña desde el primer día.</div>'+
   '</div>'+VALS;
  var st = document.getElementById('status');
  document.getElementById('copy').onclick = function(){
    if (link) copyText(link, st, 'Enlace copiado. Pégalo en un mensaje a tu RE.');
    else copyText(toText(f), st, 'Resumen copiado. Pégalo en un mensaje a tu RE.');
  };
  if (link) document.getElementById('wa').onclick = function(){
    var msg = 'Ficha de acogida de ' + S.nombre + (S.re ? ' para ' + S.re : '') + ': ' + link;
    window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank', 'noopener');
  };
  document.getElementById('back').onclick = function(){ viewL(1); };
  document.getElementById('again').onclick = function(){ S = newState(); viewIntro(); };
  focusTop();
}

/* PDF: se imprime la ficha con todo desplegado; el navegador ofrece "Guardar como PDF" */
function printFicha(f){
  var ds = Array.prototype.slice.call(document.querySelectorAll('details.fold')), prev = ds.map(function(d){ return d.open; }), title = document.title;
  ds.forEach(function(d){ d.open = true; });
  document.title = 'Ficha de acogida - ' + f.nombre;
  function restore(){ ds.forEach(function(d,i){ d.open = prev[i]; }); document.title = title; window.removeEventListener('afterprint', restore); }
  window.addEventListener('afterprint', restore);
  window.print();
}

/* Ficha del RE: se abre desde el enlace */
function viewFicha(st){
  tagEl.textContent = 'Ficha para el RE';
  setProgress(TOTAL-1);
  var f = buildFicha(st);
  var cards = f.pf.tipo==='sin'
    ? '<div class="card"><h3>Sin preferencia clara</h3><p>Usa la base común, observa cómo reacciona y ajusta según lo que veas.</p></div>'
    : f.estilos.map(function(e){
        return '<div class="card"><h3>'+esc(e.name)+'</h3><p>'+esc(e.aprende)+'</p>'+
          '<h4>Cómo explicarle</h4>'+listHtml(e.explicar)+
          '<h4>Feedback</h4><p>'+esc(e.feedback)+'</p>'+
          '<h4>Señales y qué hacer</h4>'+sigHtml(e.senales)+
          (e.nota ? '<p class="muted small" style="margin-top:10px">'+esc(e.nota)+'</p>' : '')+'</div>';
      }).join('');
  app.innerHTML =
   '<p class="eyebrow">Ficha para el RE · '+esc(f.fecha)+'</p>'+
   '<h1>Cómo enseñar a '+esc(f.nombre)+'</h1>'+
   (f.re ? '<p class="muted" style="margin-top:10px">Para: '+esc(f.re)+'</p>' : '')+
   '<div class="facts">'+f.facts.map(function(x){ return '<div class="fact"><span class="k">'+esc(x[0])+'</span><span class="v">'+esc(x[1])+'</span></div>'; }).join('')+'</div>'+
   '<div class="action"><span class="k">Empieza por esto</span><p>'+esc(f.empieza)+'</p></div>'+
   '<section class="sec"><h2>Tres cosas para hoy</h2>'+listHtml(f.ajustes)+'</section>'+
   (f.senales.length ? '<section class="sec"><h2>'+(f.senales.length>1 ? 'Señales a vigilar' : 'Una señal a vigilar')+'</h2>'+sigHtml(f.senales)+'</section>' : '')+
   '<details class="fold"><summary>Cómo enseñarle</summary><div class="inner">'+(f.nota ? '<p class="hyp">'+esc(f.nota)+'</p>' : '')+'<div class="cards">'+cards+'</div></div></details>'+
   '<details class="fold"><summary>Base común para todos</summary><div class="inner">'+listHtml(COMUN)+'</div></details>'+
   '<details class="fold"><summary>Comprueba hoy</summary><div class="inner">'+listHtml(COMPRUEBA)+'</div></details>'+
   '<p class="note">'+esc(AVISO)+'</p>'+
   '<div class="closing">Manda lo que ves hoy, no la ficha.</div>'+
   '<div class="row" style="margin-top:24px"><button class="btn btn-ink" id="copy" type="button">Copiar ficha</button><button class="btn btn-primary" id="pdf" type="button">Guardar PDF</button><button class="btn btn-ghost" id="again" type="button">Nueva ficha</button></div>'+
   '<p class="status" id="status" role="status"></p>'+VALS;
  var txt = toText(f);
  document.getElementById('copy').onclick = function(){ copyText(txt, document.getElementById('status'), 'Ficha copiada. Ya puedes pegarla donde quieras.'); };
  document.getElementById('pdf').onclick = function(){ printFicha(f); };
  document.getElementById('again').onclick = function(){ S = newState(); location.hash = ''; route(); };
  focusTop();
}

function route(){
  var st = decodeState(location.hash);
  if (st) viewFicha(st); else viewIntro();
}
window.addEventListener('hashchange', route);

window.__ficha = {profile:profile, buildFicha:buildFicha, toText:toText, guiaNivel:guiaNivel, encodeState:encodeState, decodeState:decodeState, prefLabel:prefLabel, ST:ST};
route();
</script>
